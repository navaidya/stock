# Hand-curated reference values the market data API does not carry.
#
# PUBLIC REPO: public facts about companies only — ratings published by the
# agencies, figures disclosed in filings. Never anything about a position.
#
# ─────────────────────────────────────────────────────────────────────────────
# EVERY VALUE BELOW IS UNVERIFIED.
#
# These seeds were written from an agent's recall of public rating actions and
# earnings releases, not read off a primary source. They are here so the columns
# have something to render and so the shape of the file is obvious — not because
# they are known to be right. Before trusting any of them on the dashboard,
# check it against the source named in the entry:
#
#   credit rating — the issuer's page on standardandpoors.com / moodys.com,
#                   or the "credit ratings" page in the company's IR site
#   RPO           — the revenue recognition note, or the "remaining performance
#                   obligations" line in the latest 10-Q/10-K or press release
#
# Correct anything wrong, and move its asOf to the date you checked. Tracked as
# an open gap against MOD-24 in specs/SPEC.md.
# ─────────────────────────────────────────────────────────────────────────────
#
# Schema, per ticker — every field optional:
#
#   creditRating:        long-term ISSUER rating. S&P/Fitch (`BBB+`) or Moody's
#                        (`Baa1`) notation; stored canonically as S&P's. Anything
#                        off the scale is dropped rather than displayed, so leave
#                        an unrated issuer out entirely instead of writing `NR`.
#   creditRatingAgency:  who issued it, since the scales are not interchangeable
#                        in practice even where the notches line up.
#   creditRatingAsOf:    ISO date the rating was checked or last affirmed.
#   rpo:                 remaining performance obligation, in MILLIONS of USD —
#                        the same unit as market cap. 600000 is $600B.
#   rpoAsOf:             the fiscal period end the figure belongs to, not the
#                        date it was announced.
#   rpoSource:           which release or filing it came from.
#
# Most companies do not report RPO at all. It is a software and cloud
# disclosure — contracted revenue not yet recognised. Its absence for a
# semiconductor or a utility is normal, not a gap to fill.

