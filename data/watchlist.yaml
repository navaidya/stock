# Confirmed by the repository owner. Kept generic on purpose: this repo is
# public, and the set of tickers a named person follows is itself personal
# information even though no individual ticker is secret (SEC-4). A real list
# belongs in watchlist.local.yaml, which .gitignore already reserves.
#
# PUBLIC REPO: tickers only. Never add share counts, cost basis, purchase
# dates, or P&L to this file — see the "This repository is PUBLIC" section in
# CLAUDE.md.

