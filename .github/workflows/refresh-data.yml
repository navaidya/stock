name: Refresh market data

on:
  schedule:
    # Weekdays, twice during US market hours and once after the close.
    # GitHub cron is best effort and is often delayed under load, so treat
    # these as approximate — the dashboard shows its own data age.
    - cron: '35 14 * * 1-5'
    - cron: '35 18 * * 1-5'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      # Commit logic lives in a script so it can be tested (COL-6). The inline
      # version this replaces silently discarded the first collection.
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          ./scripts/commit-data.sh
      - run: git push

  # The push above is made with GITHUB_TOKEN, and GitHub does not trigger
  # workflows from such a push — so deploy.yml's push trigger never fires for a
  # data commit. Without this job the collector commits data that is never
  # built, which looks exactly like a working pipeline (COL-17).
  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
