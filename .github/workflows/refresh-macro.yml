name: Refresh macro data

on:
  schedule:
    # Once a day, weekdays, at 15:00 UTC — 11:00 ET (EDT) / 10:00 ET (EST).
    # Every tracked release BLS/BEA/Census publishes lands at 8:30am ET, and
    # the University of Michigan's is by 10:00am ET; this runs safely after
    # all of them so a same-day release is picked up on the very next run
    # rather than the following day (MAC-3, MAC-17). Every series is monthly
    # or slower, so once a day is still enough — there is nothing to gain
    # from checking more often on days nothing was scheduled to publish.
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-macro
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect:macro
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          ./scripts/commit-data.sh data/macro.json 'chore: refresh macro data'
      # See scripts/push-with-rebase.sh (COL-24): this can race with the other
      # two refresh workflows the same way they can race each other.
      - run: ./scripts/push-with-rebase.sh

  # Same reasoning as the other refresh workflows' deploy job (COL-17): a push
  # made with GITHUB_TOKEN does not trigger deploy.yml's own push trigger.
  deploy:
    needs: refresh
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
